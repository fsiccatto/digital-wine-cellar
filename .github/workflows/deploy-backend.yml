name: Deploy backend

# El backend sale solo, pero nunca antes que sus tests: el frontend publicado
# ya apunta a este servicio y una revision rota se ve en la app al instante.
#
# Los tests no se repiten aca: se espera a que CI termine en verde sobre este
# mismo commit. workflow_run no filtra por path ni por rama, asi que eso lo
# comprueba el job de abajo antes de tocar nada.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:

# Una revision a la vez, y no se cancela la que ya esta saliendo: cortar un
# deploy por la mitad deja el servicio en un estado que nadie eligio.
concurrency:
  group: deploy-backend
  cancel-in-progress: false

env:
  REGION: us-central1
  SERVICE: digital-wine-cellar-backend

jobs:
  # workflow_run se dispara con CADA corrida de CI: de otra rama, de un pull
  # request, o de un commit que no toco el backend. Este job decide si lo que
  # sigue tiene sentido.
  decidir:
    runs-on: ubuntu-latest
    outputs:
      desplegar: ${{ steps.chequeo.outputs.desplegar }}
      sha: ${{ steps.chequeo.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Sin esto se clona main; hace falta el commit exacto que probo CI.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2

      - id: chequeo
        run: |
          SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

          # A mano (workflow_dispatch) se despliega siempre.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "desplegar=si" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${{ github.event.workflow_run.conclusion }}" != "success" ]; then
            echo "CI no paso: no se despliega."
            echo "desplegar=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${{ github.event.workflow_run.head_branch }}" != "main" ]; then
            echo "No es main: no se despliega."
            echo "desplegar=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Lo que push.paths hacia solo: si el commit no toco el backend, no
          # hay imagen nueva que construir.
          if git diff --name-only HEAD~1 HEAD | grep -qE '^backend/|^\.github/workflows/deploy-backend\.yml$'; then
            echo "El commit toca el backend: se despliega."
            echo "desplegar=si" >> "$GITHUB_OUTPUT"
          else
            echo "El commit no toca el backend: no se despliega."
            echo "desplegar=no" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: decidir
    if: needs.decidir.outputs.desplegar == 'si'
    runs-on: ubuntu-latest

    # Federacion con GCP: el token OIDC de este workflow se cambia por uno
    # temporal de Google. Sin esto no hay credencial que guardar en el repo.
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.decidir.outputs.sha }}

      - name: Verificar configuracion
        run: |
          if [ -z "${{ vars.GCP_PROJECT_ID }}" ] || [ -z "${{ vars.GCP_WIF_PROVIDER }}" ] || [ -z "${{ vars.GCP_DEPLOY_SA }}" ]; then
            echo "::error::Faltan variables del repo. Corré 'terraform apply' y cargá sus outputs en Settings > Secrets and variables > Actions > Variables: GCP_PROJECT_ID, GCP_WIF_PROVIDER, GCP_DEPLOY_SA."
            exit 1
          fi

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Construir la imagen
        # El tag es el SHA del commit: cada revision se rastrea hasta su codigo
        # y se puede volver a una anterior sin reconstruir nada.
        #
        # --async y espera propia en vez del streaming de gcloud: para seguir
        # los logs en vivo hace falta permiso de lectura sobre el bucket donde
        # Cloud Build los escribe, y sin el `builds submit` termina en error
        # aunque la imagen se haya construido bien. Lo que importa aca es el
        # estado final del build, no ver los logs pasar.
        env:
          SHA_PROBADO: ${{ needs.decidir.outputs.sha }}
        run: |
          SHA_CORTO="${SHA_PROBADO:0:7}"
          IMAGE="${REGION}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_ARTIFACT_REPO || 'cloud-run-source-deploy' }}/${SERVICE}:${SHA_CORTO}"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

          BUILD_ID="$(gcloud builds submit backend --tag "$IMAGE" --async --format='value(id)' --quiet)"
          echo "Build $BUILD_ID lanzado"

          # ~10 min de techo: el build completo tarda cerca de uno.
          for _ in $(seq 1 120); do
            ESTADO="$(gcloud builds describe "$BUILD_ID" --format='value(status)' --quiet)"
            case "$ESTADO" in
              SUCCESS)
                echo "Build OK: $IMAGE"
                exit 0
                ;;
              FAILURE|INTERNAL_ERROR|TIMEOUT|CANCELLED|EXPIRED)
                echo "::error::El build termino en $ESTADO. Logs: https://console.cloud.google.com/cloud-build/builds/$BUILD_ID?project=${{ vars.GCP_PROJECT_ID }}"
                exit 1
                ;;
            esac
            sleep 5
          done

          echo "::error::El build no termino a tiempo. Logs: https://console.cloud.google.com/cloud-build/builds/$BUILD_ID?project=${{ vars.GCP_PROJECT_ID }}"
          exit 1

      - name: Desplegar
        # Solo la imagen: las env vars, los secretos y la SA los maneja
        # Terraform, y pasarlos aca los pisaria con lo que diga este archivo.
        run: |
          gcloud run deploy "$SERVICE" \
            --image="$IMAGE" \
            --region="$REGION" \
            --quiet

      - name: Verificar que el trafico va a la revision nueva
        # Un rollback anterior pudo haber clavado el trafico a una revision
        # fija. Ahi el deploy "sale bien" pero no cambia nada: la revision
        # nueva queda creada y sin recibir un solo pedido.
        run: |
          SIRVE="$(gcloud run services describe "$SERVICE" --region="$REGION" \
            --format='value(status.traffic[0].revisionName)')"
          ULTIMA="$(gcloud run services describe "$SERVICE" --region="$REGION" \
            --format='value(status.latestCreatedRevisionName)')"

          if [ "$SIRVE" != "$ULTIMA" ]; then
            echo "::error::El trafico esta fijo en $SIRVE y la revision nueva es $ULTIMA. Corregilo con: gcloud run services update-traffic $SERVICE --region=$REGION --to-latest"
            exit 1
          fi
          echo "El trafico va a $SIRVE"

      - name: Verificar que quedo sana
        # Un deploy que responde 500 no es un deploy exitoso. /health no pide
        # token; que conteste prueba que la revision arranco de verdad.
        run: |
          URL="$(gcloud run services describe "$SERVICE" --region="$REGION" --format='value(status.url)')"
          for intento in 1 2 3 4 5; do
            code="$(curl -s -o /dev/null -w '%{http_code}' "$URL/health" || true)"
            if [ "$code" = "200" ]; then
              echo "OK: $URL/health respondio 200"
              exit 0
            fi
            echo "intento $intento: health=$code, reintento en 5s"
            sleep 5
          done
          echo "::error::La revision no respondio 200 en /health. Revisá los logs de Cloud Run."
          exit 1

      - name: Si fallo, volver a la revision anterior
        # Solo si este workflow llego a publicar una revision. Si fallo
        # antes (build), no hay nada roto que arreglar y mandar el trafico
        # a la anterior seria retroceder una que servia bien.
        if: failure() && steps.desplegar.outcome == 'failure'
        run: |
          SANA="$(gcloud run revisions list --service="$SERVICE" --region="$REGION" \
            --filter='status.conditions.type=Active AND status.conditions.status=True' \
            --format='value(metadata.name)' --sort-by='~metadata.creationTimestamp' \
            | sed -n 2p)"
          if [ -z "$SANA" ]; then
            echo "::warning::No hay revision anterior a la que volver."
            exit 0
          fi

          echo "Volviendo a $SANA"
          gcloud run services update-traffic "$SERVICE" --region="$REGION" \
            --to-revisions="$SANA=100" --quiet

          # --to-revisions clava el trafico a esa revision, y el servicio
          # deja de seguir a la ultima: los deploys siguientes crean
          # revisiones que no reciben trafico y parecen no hacer nada.
          # Queda avisado para volver a --to-latest despues de arreglar.
          echo "::warning::El trafico quedo fijo en $SANA. Cuando el deploy vuelva a andar, correr: gcloud run services update-traffic $SERVICE --region=$REGION --to-latest"
