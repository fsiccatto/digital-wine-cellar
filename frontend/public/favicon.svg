<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="7" fill="#f2ece1"/>
  <!-- Una sola copa continua: caliz, tallo y base se tocan. Antes el caliz
       flotaba separado del pie y el conjunto se leia como una taza. -->
  <g fill="#7c2338">
    <!-- Caliz mas alto que ancho y de fondo hondo, que es la proporcion que
         distingue una copa de vino de un cuenco. La boca va redondeada: a
         tamano de favicon las esquinas vivas se ven como dientes. -->
    <path d="M12.6 5.4h6.8a1 1 0 0 1 1 1.08l-.55 6.12a3.85 3.85 0 0 1-7.7 0l-.55-6.12a1 1 0 0 1 1-1.08z"/>
    <rect x="15" y="15.4" width="2" height="8.8" rx="1"/>
    <rect x="11.6" y="24.2" width="8.8" height="2" rx="1"/>
  </g>
</svg>
