<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Karla:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; font-family: 'Karla', system-ui, sans-serif; }
    a { color: #c8a24a; text-decoration: none; }
    a:hover { color: #e0bc63; }
    * { box-sizing: border-box; }
  </style>
</helmet>

<div style="width: 390px; min-height: 844px; background: #17100e; color: #f2e6d8; display: flex; flex-direction: column; position: relative; overflow: hidden;">

  <div style="position: absolute; inset: 0; opacity: 0.42; background:
      repeating-linear-gradient(94deg, transparent 0 26px, rgba(92,54,32,0.14) 26px 27px, transparent 27px 61px);
      pointer-events: none;"></div>

  <!-- Encabezado -->
  <div style="position: relative; padding: 52px 22px 18px; display: flex; align-items: center; gap: 14px;">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#9c8873" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
      <path d="M15 18l-6-6 6-6"/>
    </svg>
    <div style="display: flex; flex-direction: column; gap: 2px;">
      <h1 style="margin: 0; font-family: 'Cormorant Garamond', Georgia, serif; font-size: 26px; font-weight: 600; color: #f7ecdd; line-height: 1.1;">Nueva botella</h1>
      <span style="font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: #7d6b57; font-weight: 600;">Revisá y completá</span>
    </div>
  </div>

  <!-- Foto de la etiqueta: protagonista arriba -->
  <div style="position: relative; margin: 0 22px 18px; border-radius: 13px; overflow: hidden; border: 1px solid #3b2a22; background: linear-gradient(158deg, #33201a 0%, #1c1210 100%); height: 210px; display: flex; align-items: center; justify-content: center;">

    <!-- La foto que sacó el usuario: ocupa todo el marco -->
    <div style="position: absolute; inset: 0; background: linear-gradient(168deg, #4a2f24 0%, #2a1a14 55%, #1a100d 100%);"></div>

    <!-- Etiqueta encuadrada de cerca, como sale en una foto de celular -->
    <div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; overflow: hidden;">
      <div style="width: 218px; height: 262px; margin-top: 46px; background: linear-gradient(172deg, #f4e8d6 0%, #e6d5ba 62%, #d8c4a6 100%); box-shadow: 0 14px 40px rgba(0,0,0,0.7); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 11px; padding: 26px 20px; transform: rotate(-1.4deg);">
        <div style="width: 52px; height: 1.5px; background: #8a2038;"></div>
        <span style="font-family: 'Cormorant Garamond', Georgia, serif; font-size: 13px; letter-spacing: 0.26em; text-transform: uppercase; color: #6d1428; font-weight: 700; text-align: center;">Trapiche</span>
        <span style="font-family: 'Cormorant Garamond', Georgia, serif; font-size: 27px; font-weight: 700; color: #2c1a12; text-align: center; line-height: 1.08;">Fond de Cave</span>
        <span style="font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase; color: #6b5340; font-weight: 600;">Malbec</span>
        <div style="width: 52px; height: 1.5px; background: #8a2038;"></div>
        <span style="font-family: 'Cormorant Garamond', Georgia, serif; font-size: 20px; color: #2c1a12; font-weight: 700; letter-spacing: 0.06em;">2020</span>
        <span style="font-size: 8.5px; letter-spacing: 0.16em; text-transform: uppercase; color: #7d6249; font-weight: 500; padding-top: 3px;">Mendoza · Argentina</span>
      </div>
    </div>

    <!-- Viñeteado y luz de flash: delatan que es una foto, no un dibujo -->
    <div style="position: absolute; inset: 0; background:
        radial-gradient(72% 58% at 42% 34%, rgba(255,244,225,0.16) 0%, transparent 62%),
        radial-gradient(128% 100% at 50% 50%, transparent 42%, rgba(0,0,0,0.5) 100%);
        pointer-events: none;"></div>

    <!-- Sello de lectura lograda -->
    <div style="position: absolute; z-index: 2; bottom: 11px; left: 11px; display: flex; align-items: center; gap: 7px; background: rgba(12,8,6,0.88); border: 1px solid #4a3a26; border-radius: 999px; padding: 6px 12px 6px 9px;">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#7f9463" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 6 9 17l-5-5"/>
      </svg>
      <span style="font-size: 9.5px; letter-spacing: 0.1em; text-transform: uppercase; color: #a8b98d; font-weight: 700;">Etiqueta leída</span>
    </div>

    <!-- Recapturar -->
    <div style="position: absolute; z-index: 2; top: 11px; right: 11px; display: flex; align-items: center; gap: 7px; background: rgba(12,8,6,0.85); border: 1px solid #4a3a26; border-radius: 999px; padding: 6px 12px 6px 9px;">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#c8a24a" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M21 3v5h-5"/>
        <path d="M21 12a9 9 0 0 1-15 6.7L3 16"/><path d="M3 21v-5h5"/>
      </svg>
      <span style="font-size: 9.5px; color: #c8a24a; font-weight: 700; letter-spacing: 0.04em;">Otra foto</span>
    </div>
  </div>

  <!-- Formulario -->
  <div style="position: relative; flex-grow: 1; padding: 0 22px 118px; display: flex; flex-direction: column; gap: 15px;">

    <!-- Sección: lo que leyó la etiqueta -->
    <div style="display: flex; align-items: center; gap: 11px;">
      <span style="font-size: 9.5px; letter-spacing: 0.2em; text-transform: uppercase; color: #8d7a63; font-weight: 700;">Datos del vino</span>
      <div style="flex-grow: 1; height: 1px; background: linear-gradient(90deg, #3b2a22, transparent);"></div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 13px;">
      <sc-for list="{{fields}}" as="f" hint-placeholder-count="6">
        <div style="display: flex; flex-direction: column; gap: 6px;">
          <div style="display: flex; align-items: center; gap: 7px;">
            <label style="font-size: 10px; letter-spacing: 0.13em; text-transform: uppercase; color: #8d7a63; font-weight: 700;">{{f.label}}</label>
            <sc-if value="{{f.leido}}" hint-placeholder-val="{{ true }}">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#7f9463" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 6 9 17l-5-5"/>
              </svg>
            </sc-if>
            <sc-if value="{{f.falta}}" hint-placeholder-val="{{ true }}">
              <span style="font-size: 9.5px; color: #c8a24a; font-weight: 700; letter-spacing: 0.06em;">· completar</span>
            </sc-if>
          </div>
          <!-- Campo de entrada -->
          <div style="display: flex; align-items: center; height: 46px; padding: 0 14px; background: rgba(10,6,5,0.55); border: 1px solid {{f.borde}}; border-radius: 9px;">
            <span style="font-size: 15px; color: {{f.color}}; font-weight: 500;">{{f.valor}}</span>
          </div>
        </div>
      </sc-for>
    </div>

    <!-- Sección: en la cava -->
    <div style="display: flex; align-items: center; gap: 11px; padding-top: 6px;">
      <span style="font-size: 9.5px; letter-spacing: 0.2em; text-transform: uppercase; color: #8d7a63; font-weight: 700;">En la cava</span>
      <div style="flex-grow: 1; height: 1px; background: linear-gradient(90deg, #3b2a22, transparent);"></div>
    </div>

    <div style="display: flex; gap: 11px;">
      <!-- Cantidad -->
      <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 6px;">
        <label style="font-size: 10px; letter-spacing: 0.13em; text-transform: uppercase; color: #8d7a63; font-weight: 700;">Cantidad</label>
        <div style="display: flex; align-items: center; justify-content: space-between; height: 46px; padding: 0 9px 0 14px; background: rgba(10,6,5,0.55); border: 1px solid #3b2a22; border-radius: 9px;">
          <span style="font-size: 15px; color: #f7ecdd; font-weight: 600;">2</span>
          <div style="display: flex; gap: 5px;">
            <div style="width: 30px; height: 30px; border-radius: 7px; border: 1px solid #4a382d; display: flex; align-items: center; justify-content: center;">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#9c8873" stroke-width="2.6" stroke-linecap="round"><path d="M5 12h14"/></svg>
            </div>
            <div style="width: 30px; height: 30px; border-radius: 7px; border: 1px solid #4a382d; display: flex; align-items: center; justify-content: center;">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#c8a24a" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
            </div>
          </div>
        </div>
      </div>
      <!-- Ubicación -->
      <div style="width: 118px; display: flex; flex-direction: column; gap: 6px;">
        <label style="font-size: 10px; letter-spacing: 0.13em; text-transform: uppercase; color: #8d7a63; font-weight: 700;">Estante</label>
        <div style="display: flex; align-items: center; justify-content: space-between; height: 46px; padding: 0 12px 0 14px; background: rgba(10,6,5,0.55); border: 1px solid #3b2a22; border-radius: 9px;">
          <span style="font-size: 15px; color: #f7ecdd; font-weight: 600;">A2</span>
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#7d6b57" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m6 9 6 6 6-6"/>
          </svg>
        </div>
      </div>
    </div>

    <!-- Precio -->
    <div style="display: flex; flex-direction: column; gap: 6px;">
      <div style="display: flex; align-items: center; gap: 7px;">
        <label style="font-size: 10px; letter-spacing: 0.13em; text-transform: uppercase; color: #8d7a63; font-weight: 700;">Precio</label>
        <span style="font-size: 9.5px; color: #6d5c4b; font-weight: 500;">· opcional</span>
      </div>
      <div style="display: flex; align-items: center; gap: 8px; height: 46px; padding: 0 14px; background: rgba(10,6,5,0.55); border: 1px solid #3b2a22; border-radius: 9px;">
        <span style="font-size: 15px; color: #6d5c4b;">$</span>
        <span style="font-size: 15px; color: #6d5c4b;">—</span>
      </div>
    </div>

    <!-- Código asignado -->
    <div style="display: flex; align-items: center; gap: 11px; padding: 13px 14px; background: rgba(200,162,74,0.06); border: 1px dashed #4a3a26; border-radius: 9px; margin-top: 4px;">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#b08c50" stroke-width="1.8" stroke-linecap="round" style="flex-shrink: 0;">
        <rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 9v6M11 9v6M15 9v6M18 9v6"/>
      </svg>
      <div style="display: flex; flex-direction: column; gap: 2px;">
        <span style="font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase; color: #8d7a63; font-weight: 700;">Se guarda como</span>
        <span style="font-family: 'Karla', monospace; font-size: 13.5px; font-weight: 700; color: #c8a24a; letter-spacing: 0.06em;">TRA-MAL-2020-0002</span>
      </div>
    </div>
  </div>

  <!-- Acciones -->
  <div style="position: absolute; bottom: 0; left: 0; right: 0; display: flex; gap: 10px; padding: 16px 22px 30px; background: linear-gradient(180deg, rgba(23,16,14,0) 0%, rgba(15,10,8,0.97) 40%); backdrop-filter: blur(7px);">
    <div style="width: 52px; height: 52px; border-radius: 12px; border: 1px solid #4a382d; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#9c8873" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/>
      </svg>
    </div>
    <div style="flex-grow: 1; height: 52px; border-radius: 12px; background: linear-gradient(150deg, #8a2038 0%, #5e1023 100%); display: flex; align-items: center; justify-content: center; gap: 10px; box-shadow: 0 7px 20px rgba(138,32,56,0.34), inset 0 1px 0 rgba(255,255,255,0.12);">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#f7ecdd" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 6 9 17l-5-5"/>
      </svg>
      <span style="font-size: 14px; font-weight: 700; color: #f7ecdd; letter-spacing: 0.03em;">Guardar en la cava</span>
    </div>
  </div>

</div>
</x-dc>

<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() {
    const leidoBorde = '#3b2a22';
    const faltaBorde = 'rgba(200,162,74,0.34)';
    return {
      fields: [
        { label: 'Bodega',   valor: 'Trapiche',          leido: true,  falta: false, borde: leidoBorde, color: '#f7ecdd' },
        { label: 'Vino',     valor: 'Fond de Cave',      leido: true,  falta: false, borde: leidoBorde, color: '#f7ecdd' },
        { label: 'Varietal', valor: 'Malbec',            leido: true,  falta: false, borde: leidoBorde, color: '#f7ecdd' },
        { label: 'Añada',    valor: '2020',              leido: true,  falta: false, borde: leidoBorde, color: '#f7ecdd' },
        { label: 'Región',   valor: 'Maipú, Mendoza',    leido: true,  falta: false, borde: leidoBorde, color: '#f7ecdd' },
        { label: 'Alcohol',  valor: 'Sin dato',          leido: false, falta: true,  borde: faltaBorde, color: '#6d5c4b' }
      ]
    };
  }
}
</script>
</body>
</html>
