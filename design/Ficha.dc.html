<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Karla:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; font-family: 'Karla', system-ui, sans-serif; }
    a { color: #c8a24a; text-decoration: none; }
    a:hover { color: #e0bc63; }
    * { box-sizing: border-box; }
  </style>
</helmet>

<div style="width: 390px; min-height: 844px; background: #17100e; color: #f2e6d8; display: flex; flex-direction: column; position: relative; overflow: hidden;">

  <!-- Cabecera con vino derramado -->
  <div style="position: relative; padding: 52px 22px 26px; background:
      radial-gradient(128% 82% at 50% 0%, rgba(109,20,40,0.42) 0%, rgba(23,16,14,0) 68%);">

    <div style="position: absolute; inset: 0; opacity: 0.34; background:
        repeating-linear-gradient(94deg, transparent 0 26px, rgba(92,54,32,0.16) 26px 27px, transparent 27px 61px);
        pointer-events: none;"></div>

    <!-- Barra superior -->
    <div style="position: relative; display: flex; align-items: center; justify-content: space-between; padding-bottom: 24px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#9c8873" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 18l-6-6 6-6"/>
      </svg>
      <div style="display: flex; gap: 16px;">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#9c8873" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M11 4h2M4 11v2M20 11v2M11 20h2"/>
          <path d="M17.5 6.5 12 12l-5.5-5.5M6.5 17.5 12 12l5.5 5.5"/>
        </svg>
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#9c8873" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="5" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="12" cy="19" r="1.4"/>
        </svg>
      </div>
    </div>

    <!-- Identidad -->
    <div style="position: relative; display: flex; gap: 18px; align-items: flex-start;">

      <!-- Botella -->
      <div style="flex-shrink: 0;">
        <svg width="52" height="132" viewBox="0 0 52 132" fill="none">
          <!-- Vidrio claro para separarse de la madera del fondo -->
          <path d="M20 4h12v25c0 4 9 9 9 19v78a4 4 0 0 1-4 4H15a4 4 0 0 1-4-4V48c0-10 9-15 9-19V4z" fill="#7d2236" stroke="#c25068" stroke-width="1.5"/>
          <rect x="12" y="66" width="28" height="42" rx="2.5" fill="#efe2ce" fill-opacity="0.94"/>
          <path d="M20 4h12v7H20z" fill="#c25068"/>
          <path d="M17 72h18M17 78h13" stroke="#8a2038" stroke-width="1.1" stroke-linecap="round" opacity="0.62"/>
          <path d="M17 90h18M17 96h11" stroke="#6b5340" stroke-width="0.9" stroke-linecap="round" opacity="0.48"/>
          <!-- Reflejo -->
          <path d="M16 52v54" stroke="#f7ecdd" stroke-width="2.2" stroke-linecap="round" opacity="0.26"/>
        </svg>
      </div>

      <!-- Datos -->
      <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 6px; padding-top: 5px; min-width: 0;">
        <span style="font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: #b08c50; font-weight: 700;">Catena Zapata</span>
        <h1 style="margin: 0; font-family: 'Cormorant Garamond', Georgia, serif; font-size: 31px; font-weight: 600; color: #f7ecdd; line-height: 1.06; letter-spacing: -0.01em;">Adrianna Vineyard</h1>
        <div style="display: flex; align-items: center; gap: 9px; padding-top: 3px;">
          <span style="font-size: 12.5px; color: #c8a24a; font-weight: 600;">Malbec</span>
          <div style="width: 3px; height: 3px; border-radius: 50%; background: #5c4c3e;"></div>
          <span style="font-size: 12.5px; color: #9c8873;">2019</span>
          <div style="width: 3px; height: 3px; border-radius: 50%; background: #5c4c3e;"></div>
          <span style="font-size: 12.5px; color: #9c8873;">14,5%</span>
        </div>
        <span style="font-size: 11.5px; color: #7d6b57; padding-top: 1px;">Gualtallary, Valle de Uco</span>
      </div>
    </div>
  </div>

  <!-- Stock -->
  <div style="position: relative; margin: 0 22px 20px; display: flex; align-items: center; gap: 14px; background: linear-gradient(100deg, rgba(38,23,18,0.9) 0%, rgba(26,16,13,0.9) 100%); border: 1px solid #3b2a22; border-radius: 12px; padding: 16px 18px;">
    <div style="display: flex; flex-direction: column; gap: 2px;">
      <span style="font-size: 9px; letter-spacing: 0.16em; text-transform: uppercase; color: #8d7a63; font-weight: 700;">En cava</span>
      <div style="display: flex; align-items: baseline; gap: 6px;">
        <span style="font-family: 'Cormorant Garamond', Georgia, serif; font-size: 34px; font-weight: 600; color: #c8a24a; line-height: 1;">3</span>
        <span style="font-size: 12px; color: #7d6b57;">botellas</span>
      </div>
    </div>

    <div style="width: 1px; align-self: stretch; background: #3b2a22;"></div>

    <div style="display: flex; flex-direction: column; gap: 7px; flex-grow: 1;">
      <div style="display: flex; justify-content: space-between;">
        <span style="font-size: 10.5px; color: #8d7a63;">Estante</span>
        <span style="font-size: 10.5px; color: #f2e6d8; font-weight: 600;">A1</span>
      </div>
      <div style="display: flex; justify-content: space-between;">
        <span style="font-size: 10.5px; color: #8d7a63;">Ingreso</span>
        <span style="font-size: 10.5px; color: #f2e6d8; font-weight: 600;">12 mar 2026</span>
      </div>
      <div style="display: flex; justify-content: space-between;">
        <span style="font-size: 10.5px; color: #8d7a63;">Código</span>
        <span style="font-family: 'Karla', monospace; font-size: 10px; color: #b08c50; font-weight: 700; letter-spacing: 0.04em;">CAT-MAL-2019-0001</span>
      </div>
    </div>
  </div>

  <!-- Descorchar -->
  <div style="position: relative; margin: 0 22px 26px; height: 54px; border-radius: 12px; background: linear-gradient(150deg, #8a2038 0%, #5e1023 100%); display: flex; align-items: center; justify-content: center; gap: 11px; box-shadow: 0 8px 22px rgba(138,32,56,0.36), inset 0 1px 0 rgba(255,255,255,0.12);">
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#f7ecdd" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9.5 3h5v4.5c0 1.6 2.5 2.8 2.5 5.5V20a1 1 0 0 1-1 1H8a1 1 0 0 1-1-1v-7c0-2.7 2.5-3.9 2.5-5.5V3z"/>
      <path d="M12 3V1.5"/>
    </svg>
    <span style="font-size: 15px; font-weight: 700; color: #f7ecdd; letter-spacing: 0.02em;">Descorchar una</span>
  </div>

  <!-- Historial de catas -->
  <div style="position: relative; flex-grow: 1; padding: 0 22px 34px; display: flex; flex-direction: column; gap: 14px;">

    <div style="display: flex; align-items: center; gap: 11px;">
      <span style="font-size: 9.5px; letter-spacing: 0.2em; text-transform: uppercase; color: #8d7a63; font-weight: 700;">Catas anteriores</span>
      <div style="flex-grow: 1; height: 1px; background: linear-gradient(90deg, #3b2a22, transparent);"></div>
      <span style="font-size: 9.5px; color: #6d5c4b; font-weight: 500;">2</span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px;">
      <sc-for list="{{catas}}" as="c" hint-placeholder-count="2">
        <div style="display: flex; flex-direction: column; gap: 9px; background: rgba(38,23,18,0.55); border: 1px solid #3b2a22; border-radius: 11px; padding: 14px 15px;">

          <div style="display: flex; align-items: center; justify-content: space-between;">
            <span style="font-size: 10.5px; color: #9c8873; font-weight: 600;">{{c.fecha}}</span>
            <div style="display: flex; gap: 3px;">
              <sc-for list="{{c.copas}}" as="copa" hint-placeholder-count="5">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="{{copa.relleno}}" stroke="{{copa.trazo}}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M8 3h8l-1 7.5a4 4 0 0 1-6 0L8 3z"/><path d="M12 14v6M9 20h6"/>
                </svg>
              </sc-for>
            </div>
          </div>

          <span style="font-size: 12.5px; line-height: 1.5; color: #e0d3c2;">{{c.notas}}</span>

          <div style="display: flex; align-items: center; gap: 7px; padding-top: 2px;">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#7f9463" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 20V9a3 3 0 0 1 3-3h1V4h8v2h1a3 3 0 0 1 3 3v11z"/><path d="M4 14h16"/>
            </svg>
            <span style="font-size: 11px; color: #8fa374; font-weight: 500;">{{c.maridaje}}</span>
          </div>
        </div>
      </sc-for>
    </div>
  </div>

</div>
</x-dc>

<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() {
    const copas = (n) => Array.from({ length: 5 }, (_, i) => ({
      relleno: i < n ? '#c8a24a' : 'none',
      trazo:   i < n ? '#c8a24a' : '#4a382d'
    }));
    return {
      catas: [
        {
          fecha: '4 jul 2026',
          copas: copas(5),
          notas: 'Ciruela negra y violetas, taninos pulidos. El mejor de la caja hasta ahora — vale esperar los que quedan.',
          maridaje: 'Ojo de bife a la parrilla'
        },
        {
          fecha: '18 feb 2026',
          copas: copas(4),
          notas: 'Todavía cerrado al abrir, se abrió lindo después de media hora en el decantador.',
          maridaje: 'Cordero al horno'
        }
      ]
    };
  }
}
</script>
</body>
</html>
